; RE360 — PHP settings for Hostinger (LiteSpeed / PHP-FPM reads .user.ini)
; Changes can take up to 5 minutes to apply (PHP caches this file).

upload_max_filesize = 12M
post_max_size = 14M
max_file_uploads = 20
memory_limit = 256M
max_execution_time = 120
max_input_vars = 3000

display_errors = Off
log_errors = On

date.timezone = Asia/Kolkata

session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1
session.gc_maxlifetime = 28800
